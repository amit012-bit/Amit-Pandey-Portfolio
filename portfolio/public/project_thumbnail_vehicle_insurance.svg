  <text x="105" y="257" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="22" fill="#60a5fa" font-weight="900">3NF</text>
  <text x="105" y="275" text-anchor="middle" font-family="monospace" font-size="10" fill="#6b7280">Fully normalised</text>
  <text x="105" y="288" text-anchor="middle" font-family="monospace" font-size="10" fill="#6b7280">schema design</text>

  <rect x="186" y="234" width="130" height="64" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.1" rx="8"/>
