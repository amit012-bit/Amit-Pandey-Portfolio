<svg width="100%" viewBox="0 0 730 410" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Vehicle Insurance Database project thumbnail</title>
  <desc>Dark themed thumbnail for normalised relational schema for vehicle insurance system</desc>

  <rect width="680" height="400" fill="#0a0a0f" rx="12"/>
  <defs>
    <pattern id="dots7" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="680" height="400" fill="url(#dots7)" rx="12"/>

  <rect x="0" y="0" width="680" height="3" fill="#60a5fa" rx="2"/>
  <ellipse cx="520" cy="160" rx="200" ry="160" fill="#60a5fa" opacity="0.04"/>

  <rect x="40" y="36" width="90" height="26" fill="none" stroke="#60a5fa" stroke-width="1" rx="4"/>
  <text x="85" y="53" text-anchor="middle" font-family="monospace" font-size="11" fill="#60a5fa" font-weight="600" letter-spacing="1">DATABASE</text>

  <text x="40" y="115" font-family="'Arial Black', sans-serif" font-size="38" fill="#ffffff" font-weight="900">Vehicle Insurance</text>
  <text x="40" y="160" font-family="'Arial Black', sans-serif" font-size="38" fill="#ffffff" font-weight="900">Database</text>

  <text x="40" y="195" font-family="monospace" font-size="13" fill="#6b7280">SQL · MySQL · 3NF Schema · Analytical Queries</text>

  <line x1="40" y1="218" x2="640" y2="218" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>

