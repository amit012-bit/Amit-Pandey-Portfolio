  <text x="478" y="198" font-family="monospace" font-size="7" fill="#6b7280">policy_id FK</text>
  <line x1="474" y1="200" x2="544" y2="200" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
  <text x="478" y="210" font-family="monospace" font-size="7" fill="#6b7280">claim_date</text>
  <line x1="474" y1="212" x2="544" y2="212" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
