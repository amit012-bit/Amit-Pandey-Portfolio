  <line x1="474" y1="224" x2="544" y2="224" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
  <text x="478" y="234" font-family="monospace" font-size="7" fill="#6b7280">status</text>

  <!-- FK: policies → claims -->
  <line x1="601" y1="136" x2="509" y2="158" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3,2"/>
  <circle cx="601" cy="136" r="3" fill="#34d399" fill-opacity="0.5"/>
  <circle cx="509" cy="158" r="3" fill="#34d399" fill-opacity="0.7"/>

