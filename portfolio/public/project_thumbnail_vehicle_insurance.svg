  <text x="574" y="90" font-family="monospace" font-size="7" fill="#6b7280">vehicle_id FK</text>
  <line x1="570" y1="92" x2="632" y2="92" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
