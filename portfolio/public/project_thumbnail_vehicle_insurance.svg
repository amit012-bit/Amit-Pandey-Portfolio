  <text x="546" y="259" text-anchor="middle" font-family="monospace" font-size="8" fill="#60a5fa" opacity="0.7">SELECT · JOIN · GROUP BY · INDEX</text>

  <!-- Tech pills -->
  <rect x="40" y="326" width="36" height="22" fill="#60a5fa" fill-opacity="0.1" stroke="#60a5fa" stroke-width="0.5" stroke-opacity="0.4" rx="11"/>
  <text x="58" y="341" text-anchor="middle" font-family="monospace" font-size="10" fill="#60a5fa">SQL</text>

  <rect x="86" y="326" width="52" height="22" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-width="0.5" stroke-opacity="0.4" rx="11"/>
  <text x="112" y="341" text-anchor="middle" font-family="monospace" font-size="10" fill="#22d3ee">MySQL</text>

  <rect x="148" y="326" width="42" height="22" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-width="0.5" stroke-opacity="0.4" rx="11"/>
  <text x="169" y="341" text-anchor="middle" font-family="monospace" font-size="10" fill="#34d399">3NF</text>

  <rect x="200" y="326" width="90" height="22" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-width="0.5" stroke-opacity="0.4" rx="11"/>
  <text x="245" y="341" text-anchor="middle" font-family="monospace" font-size="10" fill="#fbbf24">Schema Design</text>

  <rect x="300" y="326" width="86" height="22" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.4" rx="11"/>
  <text x="343" y="341" text-anchor="middle" font-family="monospace" font-size="10" fill="#a78bfa">Data Integrity</text>

  <text x="40" y="382" font-family="monospace" font-size="12" fill="#ffffff" opacity="0.5">view project →</text>
